name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  continuous_integration:
    runs-on: ubuntu-latest
    steps:
      - name: checkout the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - name: setup python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 #7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: install dependencies
        run: pip install -r requirements.txt
      - name: compile application
        run: |
          echo "Compiling the application"
          if ! python3 -m compileall pixelpost; then
            echo "::error:: Python compilation failed. One or more files contain syntax errors"
            exit 1
          fi
      - name: test
        run: |
          echo "Running the pytest"
          python3 -m pytest tests/ --junitxml=test-results.xml
      - name: upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: test-results
          path: test-results.xml

